name: Independent Sales V1 QA

on:
  push:
    branches:
      - audit/ventas-v1-independent-qa-20261024

permissions:
  contents: read

jobs:
  sales-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      XDG_DATA_HOME: ${{ runner.temp }}/sales-qa-data
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout code snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-timeout
          python -m pip check
      - name: Compile and import Sales
        run: |
          python -m compileall -q core/ventas views/ventas views/main_window.py
          python - <<'PY'
          from core.ventas.application.services import SalesService
          from core.ventas.infrastructure.exporters import export_pdf, export_xlsx
          from views.ventas.shell import SalesView
          print("Sales import PASS")
          PY
      - name: Independent sales contract QA
        run: python -m pytest -q tests/ventas/test_sales_contracts.py --timeout=120 -ra
      - name: Construction core regression checks
        run: python -m pytest -q tests/test_reglas_negocio.py tests/test_core.py --timeout=120 -ra
      - name: Qt Sales workspace synthetic startup smoke
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from types import SimpleNamespace
          from PySide6.QtWidgets import QApplication
          import core.config as c
          with TemporaryDirectory(prefix="ventas-qt-qa-") as folder:
              db=Path(folder)/"qa.db"
              sqlite3.connect(db).close()
              c.DB_PATH=db
              app=QApplication.instance() or QApplication([])
              from views.ventas.shell import SalesView
              user=SimpleNamespace(id=1,username="qa",nombre="QA",es_invitado=False)
              view=SalesView(user)
              view.show()
              app.processEvents()
              assert view.tabs.count() == 5, view.tabs.count()
              view.close()
              view.deleteLater()
              app.processEvents()
              print("Qt Sales workspace startup PASS")
          PY
