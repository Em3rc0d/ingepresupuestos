name: Audit test isolation on unchanged main

on:
  push:
    branches:
      - audit/test-file-isolation-20261024

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and test runner
        run: python -m pip install -r requirements.txt pytest pytest-timeout
      - name: Run selected inherited tests in fresh Python processes
        shell: bash
        run: |
          set +e
          errors=0
          for path in tests/test_decimales_cantidad_por_tipo.py tests/test_ronda7_david.py tests/test_resumen_sub_y_gantt_columnas.py tests/test_dias_no_laborables.py tests/test_orden_insumos_acu.py tests/test_indices_inei.py tests/test_franjas_imagen.py tests/test_appimage.py; do
            echo "----- ISOLATED MODULE $path -----"
            pytest -q "$path" --timeout=70 --maxfail=8 -ra
            rc=$?
            echo "ISOLATED RESULT $path exit=$rc"
            if test "$rc" -ne 0; then errors=$((errors+1)); fi
          done
          echo "Isolated test-file groups failing: $errors"
          if test "$errors" -gt 0; then exit 1; fi
