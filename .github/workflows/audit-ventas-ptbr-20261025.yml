name: Verify Sales Portuguese translations
on:
  push:
    branches:
      - fix/ventas-pt-br-localization-20261025
permissions:
  contents: read
jobs:
  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout
      - name: Verify complete pt_BR translations, markup and safe import
        run: python -m pytest tests/test_i18n.py -q --timeout=90 -ra
      - name: Verify Sales contracts unaffected by resource edits
        run: python -m pytest tests/ventas/test_sales_contracts.py -q --timeout=90 -ra
