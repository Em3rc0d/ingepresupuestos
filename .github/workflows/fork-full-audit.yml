name: Full isolated regression and SQLite seed audit

on:
  push:
    branches: [fix/fork-stabilization-20261024]
    paths:
      - ".github/workflows/fork-full-audit.yml"
      - "scripts/audit_seed.py"
      - "scripts/audit_test_files.py"
      - "tests/**"
      - "views/**"
      - "core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-full-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: SQLite integrity and metadata-only seed profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect immutable SQLite seed
        run: python scripts/audit_seed.py presupuestos_seed.db --output seed-metadata.json
      - name: Publish seed metadata receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-metadata-only
          path: seed-metadata.json
          if-no-files-found: ignore
          retention-days: 1

  complete:
    name: Full regression with one fresh Python process per test file
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Application and pytest dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-timeout
          python -m pip check
      - name: All test modules in isolated processes and temp databases
        run: python scripts/audit_test_files.py --timeout 150 --output full-isolated-results.json
      - name: Upload CI receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-isolated-results
          path: full-isolated-results.json
          if-no-files-found: ignore
          retention-days: 1
