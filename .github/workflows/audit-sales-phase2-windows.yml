name: Independent Sales Phase 2 Windows QA - focused
on:
  push:
    branches:
      - audit/ventas-phase2-windows-20261025
permissions:
  contents: read
jobs:
  phase2-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
      QT_FONT_DPI: "96"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source syntax
        run: python -m compileall -q core/ventas views/ventas views/main_window.py tests/ventas/test_phase2_independent.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout
      - name: Phase 2 isolated functional contracts
        run: python -m pytest -q tests/ventas/test_phase2_independent.py --timeout=90 -ra
      - name: Phase 1 Sales contracts
        run: python -m pytest -q tests/ventas/test_sales_contracts.py --timeout=90 -ra
      - name: Construction core rules
        run: python -m pytest -q tests/test_reglas_negocio.py tests/test_core.py --timeout=90 -ra
      - name: GUI export smoke
        run: python -m pytest -q tests/ventas/test_sales_ui_exports.py --timeout=120 -ra
