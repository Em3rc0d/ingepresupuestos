name: Fork Windows stabilization smoke

on:
  push:
    branches: [fix/fork-stabilization-20261024]
    paths: [".github/workflows/fork-windows-stabilization.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install application and test requirements
        run: |
          python -m pip install -r requirements.txt pytest pytest-timeout
          python -m pip check
      - name: Compile existing project
        run: python -m compileall -q core views models utils scripts tests
      - name: Fork updater security regression
        run: python -m unittest discover -s tests -p "test_fork_update_policy.py" -v
      - name: Existing business rules
        run: python -m pytest -q tests/test_reglas_negocio.py tests/test_core.py --timeout=90
      - name: Windows isolated Qt regression
        run: python scripts/audit_test_files.py --timeout 140 --output windows-isolated-results.json --only tests/test_appimage.py tests/test_indices_inei.py tests/test_arbol_niveles_y_duplicar.py
      - name: Upload compact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stabilization-qa
          path: windows-isolated-results.json
          if-no-files-found: ignore
          retention-days: 1
