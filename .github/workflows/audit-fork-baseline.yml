name: Audit fork baseline (read-only)

on:
  push:
    branches:
      - feature/acu-parametrico-spike-mk1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Baseline provenance
        run: |
          echo "Fork: $GITHUB_REPOSITORY"
          echo "SHA: $GITHUB_SHA"
          python3 --version
          test -f tests/test_acu_parametrico.py
          python3 -m unittest discover -s tests -p "test_acu_parametrico.py" -v
