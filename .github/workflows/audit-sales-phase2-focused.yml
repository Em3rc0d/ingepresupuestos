name: Independent Sales Phase 2 QA - focused
on:
  push:
    branches:
      - audit/ventas-phase2-independent-20261025
permissions:
  contents: read
concurrency:
  group: ventas-phase2-focused-audit
  cancel-in-progress: true
jobs:
  phase2:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static syntax
        run: python -m compileall -q core/ventas views/ventas views/main_window.py tests/ventas/test_phase2_independent.py
      - name: Minimal Qt native libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout
      - name: QA new Phase 2 contracts
        run: python -m pytest -q tests/ventas/test_phase2_independent.py --timeout=90 -ra
      - name: Regression of previously tested Sales contracts
        run: python -m pytest -q tests/ventas/test_sales_contracts.py --timeout=90 -ra
      - name: Core Construction baseline
        run: python -m pytest -q tests/test_reglas_negocio.py tests/test_core.py --timeout=90 -ra
      - name: Sales PySide6 + exports smoke
        run: python -m pytest -q tests/ventas/test_sales_ui_exports.py --timeout=120 -ra
