name: Audit Windows cross-platform smoke

on:
  push:
    branches:
      - audit/windows-smoke-20261024

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate compilation
        run: python -m compileall -q core views models utils tests scripts
      - name: Install application requirements and pytest
        run: python -m pip install -r requirements.txt pytest pytest-timeout
      - name: Check dependency conflicts
        run: python -m pip check
      - name: Cross-platform parametric tests
        run: python -m unittest discover -s tests -p "test_acu_parametrico.py" -v
      - name: Cross-platform critical business rules
        run: pytest -q tests/test_reglas_negocio.py tests/test_core.py --timeout=90 -ra
