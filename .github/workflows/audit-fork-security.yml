name: Audit dependency and lint (read-only)

on:
  push:
    branches:
      - feature/acu-parametrico-spike-mk1

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint and dependency audit tools
        run: python -m pip install ruff pip-audit
      - name: Check new feature lint
        run: ruff check core/acu_parametrico.py tests/test_acu_parametrico.py
      - name: Inspect inherited lint baseline without blocking
        run: ruff check core views models utils tests scripts --statistics || true
      - name: Audit dependency advisories
        run: pip-audit -r requirements.txt --progress-spinner off
